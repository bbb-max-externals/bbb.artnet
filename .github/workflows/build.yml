name: Build & Package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Clone asio dependency
        run: if [ ! -f deps/osc/third-party/asio/README ]; then git clone https://github.com/2bbb/asio.git deps/osc/third-party/asio; fi
        shell: bash

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify universal binaries
        run: |
          while IFS= read -r binary; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch x86_64 arm64
          done < <(find externals -path '*/Contents/MacOS/*' -type f | sort)

      - name: Sign macOS externals
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-direct-distribution.sh sign externals

      - name: Archive macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh archive externals "$RUNNER_TEMP/macos-externals.zip"

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: bbb.artnet-macos
          path: ${{ runner.temp }}/macos-externals.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Clone asio dependency
        run: if (-not (Test-Path deps/osc/third-party/asio/README)) { git clone https://github.com/2bbb/asio.git deps/osc/third-party/asio }

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: bbb.artnet-windows
          path: externals/

  package:
    permissions:
      contents: write
    needs: [build-macos, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download macOS externals
        uses: actions/download-artifact@v8
        with:
          name: bbb.artnet-macos
          path: ${{ runner.temp }}/macos-artifact

      - name: Restore signed macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh extract "$RUNNER_TEMP/macos-artifact/macos-externals.zip" "dist/${{ github.event.repository.name }}"


      - name: Download Windows externals
        uses: actions/download-artifact@v8
        with:
          name: bbb.artnet-windows
          path: dist/bbb.artnet/externals/

      - name: Assemble package
        run: |
          mkdir -p dist/bbb.artnet
          cp package-info.json dist/bbb.artnet/
          cp README.md dist/bbb.artnet/ 2>/dev/null || true
          cp LICENSE dist/bbb.artnet/ 2>/dev/null || true
          cp -r help dist/bbb.artnet/
          cp -r extras dist/bbb.artnet/ 2>/dev/null || true

      - name: Create macOS-preserving archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent bbb.artnet bbb.artnet.zip

      - name: Notarize and verify public archive
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: .github/scripts/macos-direct-distribution.sh notarize-and-verify "dist/${{ github.event.repository.name }}.zip" "${{ github.event.repository.name }}"

      - name: Generate archive checksum
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh checksum "dist/${{ github.event.repository.name }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: bbb.artnet-latest
          path: |
            dist/${{ github.event.repository.name }}.zip
            dist/${{ github.event.repository.name }}.zip.sha256

      - name: Update latest package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/bbb.artnet.zip dist/bbb.artnet.zip.sha256 --clobber
          else
            gh release create latest dist/bbb.artnet.zip dist/bbb.artnet.zip.sha256 --title "Latest package" --notes "Automatically updated from main at ${GITHUB_SHA}." --latest
          fi

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ github.event.repository.name }}.zip
            dist/${{ github.event.repository.name }}.zip.sha256
