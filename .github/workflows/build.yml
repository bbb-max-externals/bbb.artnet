name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Clone asio dependency
        run: if [ ! -f deps/osc/third-party/asio/README ]; then git clone https://github.com/2bbb/asio.git deps/osc/third-party/asio; fi
        shell: bash

      - name: Configure and Build
        run: cmake -B build && cmake --build build --config Release

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-macos
          path: externals/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Clone asio dependency
        run: if (-not (Test-Path deps/osc/third-party/asio/README)) { git clone https://github.com/2bbb/asio.git deps/osc/third-party/asio }

      - name: Configure and Build
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 && cmake --build build --config Release

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-windows
          path: externals/
